<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>Organ Marketplace</title>
		<style>
/* Reset margins and make body fill the screen */
			body, html {
				margin: 0;
				padding: 0;
				width: 100vw;
				height: 100vh;
				background-color: #000;
				overflow: hidden; /* Removes browser scrollbars */
			}

			/* Stretch the canvas to fill the screen */
			canvas.emscripten {
				border: 0 none;
				width: 100%;
				height: 100%;
				display: block;

				image-rendering: pixelated;
			}
		</style>
	</head>
	<body>
		<canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>

		<script type='text/javascript'>
			var Module = {
				canvas: (function() {
					var canvas = document.getElementById('canvas');
					canvas.addEventListener("webglcontextlost", function(e) {
						alert('WebGL context lost. You will need to reload the page.');
						e.preventDefault();
					}, false);
					return canvas;
				})()
			};
		</script>

		{{{ SCRIPT }}}
	</body>
</html>
